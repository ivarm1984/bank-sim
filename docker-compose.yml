services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: banksim
      POSTGRES_USER: banksim
      POSTGRES_PASSWORD: banksim
    ports:
      # Host 5433, not 5432 - avoids clashing with a native Postgres install
      # that may already be running on the host.
      - "5433:5432"
    volumes:
      - banksim-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banksim -d banksim"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  banksim-db-data:
