databaseChangeLog:
  - changeSet:
      id: ledger-0003-create-journal-entries-table
      author: ivarm1984
      changes:
        - createTable:
            schemaName: ledger
            tableName: journal_entries
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: description
                  type: text
                  constraints:
                    nullable: true
              - column:
                  name: posted_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
