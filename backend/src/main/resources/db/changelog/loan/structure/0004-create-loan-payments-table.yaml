databaseChangeLog:
  - changeSet:
      id: loan-0004-create-loan-payments-table
      author: ivarm1984
      changes:
        - createTable:
            schemaName: loan
            tableName: loan_payments
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: loan_id
                  type: bigint
                  constraints:
                    nullable: false
                    references: loan.loans(id)
                    foreignKeyName: fk_loan_payments_loan
              - column:
                  name: payment_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: payment_type
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: numeric(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: interest_portion
                  type: numeric(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: principal_portion
                  type: numeric(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: outstanding_principal_after
                  type: numeric(19,4)
                  constraints:
                    nullable: false
              - column:
                  # Soft reference to ledger.journal_entries(id) - no
                  # cross-schema FK, see AGENTS.md.
                  name: journal_entry_id
                  type: bigint
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - sql:
            sql: >-
              ALTER TABLE loan.loan_payments
              ADD CONSTRAINT chk_loan_payments_payment_type
              CHECK (payment_type IN ('NORMAL', 'EARLY_PARTIAL', 'EARLY_PAYOFF'));
        - createIndex:
            schemaName: loan
            tableName: loan_payments
            indexName: idx_loan_payments_loan_id
            columns:
              - column:
                  name: loan_id
