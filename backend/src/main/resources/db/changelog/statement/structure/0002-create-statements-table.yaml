databaseChangeLog:
  - changeSet:
      id: statement-0002-create-statements-table
      author: ivarm1984
      changes:
        - createTable:
            schemaName: statement
            tableName: statements
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  # Soft reference to account.accounts(id) - no cross-schema
                  # FK, see AGENTS.md.
                  name: account_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: statement_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: opening_balance
                  type: numeric(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: closing_balance
                  type: numeric(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - sql:
            sql: >-
              CREATE UNIQUE INDEX idx_statements_account_id_date
              ON statement.statements (account_id, statement_date);
